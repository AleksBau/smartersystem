<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smarter System – Ihr Zuhause. Nur Smarter.</title>
    <link rel="preload" href="/fonts/playfair-display-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // GitHub Pages SPA routing: restore path from query string
      (function() {
        var p = window.location.search.slice(1);
        if (p.startsWith('p=')) {
          var path = decodeURIComponent(p.slice(2));
          window.history.replaceState(null, null, path || '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
